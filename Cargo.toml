[package]
name = "policy-gate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
topcoat = { version = "0.11",
            features = ["view", "router", "serve", "runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
